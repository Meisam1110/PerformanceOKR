name: Build portable Windows app

# Produces OKR-Tracker-Portable.zip: the tracker plus a self-contained
# python.org runtime, ready to unzip onto a shared drive. Nobody needs Python,
# an installer, or administrator rights to run it.
#
# Where the zip appears:
#   * every run  -> the "Artifacts" section at the bottom of the run's summary
#                   page (Actions tab). Kept for 90 days.
#   * a tag like v1.0.1 -> attached to the GitHub release as well.
#
# To build one on demand, open the Actions tab, pick this workflow and press
# "Run workflow".

on:
  push:
    # Every branch, so a usable zip exists before anything is merged.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      python_version:
        description: Embedded Python version to bundle
        default: "3.11.9"

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The browser tests skip themselves without Playwright, so install it and
      # get the real coverage.
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run the test suite
        run: python tests/run_all.py

  portable:
    name: Portable bundle
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the bundle
        run: >
          python tools/build_portable.py
          --python-version ${{ github.event.inputs.python_version || '3.11.9' }}

      # Proof the bundle runs before anyone downloads it. Deliberately started
      # from C:\Windows, which is exactly where CMD dumps you when the folder
      # lives on a network share ("UNC paths are not supported. Defaulting to
      # Windows directory."). If anything in the app still depended on the
      # working directory, this step would fail rather than the user.
      - name: Smoke-test the bundle from the wrong working directory
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "dist/OKR-Tracker-Portable").Path
          $app = Start-Process -PassThru -WindowStyle Hidden `
            -FilePath "$bundle\python\python.exe" `
            -ArgumentList "-m","okr_tracker","--no-browser","--port","8765" `
            -WorkingDirectory "C:\Windows"
          try {
            $ok = $false
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8765/api/health" -TimeoutSec 5
                if ($health.status -eq "ok") { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "the bundled app did not start" }
            $page = Invoke-WebRequest "http://127.0.0.1:8765/" -TimeoutSec 10
            if ($page.StatusCode -ne 200) { throw "the app did not serve its page" }
            if ($page.Content -notmatch "okrBootstrap") { throw "the page is missing its data" }
            Write-Host "The bundled app starts and serves correctly."
          } finally {
            if ($app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      # Proof the app read okr-tracker.ini from its own folder rather than
      # from the working directory. secret.key is written by the server on
      # startup; workspace.json is not, because the sample workspace is built
      # by the page's JavaScript and nothing here runs a browser.
      - name: Check the data folder resolved to the app folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = (Resolve-Path "dist/OKR-Tracker-Portable").Path

          Write-Host "--- bundle root ---"
          Get-ChildItem $bundle | Select-Object Mode, Length, Name | Format-Table | Out-String | Write-Host
          Write-Host "--- data folder ---"
          if (Test-Path "$bundle\data") {
            Get-ChildItem "$bundle\data" -Force | Select-Object Length, Name | Format-Table | Out-String | Write-Host
          } else {
            Write-Host "(no data folder)"
          }

          # Ask the app itself, from the working directory CMD would have left
          # us in on a network share. Out-String collapses the output to one
          # string: PowerShell's -match on an array filters instead of
          # answering true or false.
          Push-Location "C:\Windows"
          try {
            $where = & "$bundle\python\python.exe" -m okr_tracker where 2>&1 | Out-String
          } finally {
            Pop-Location
          }
          Write-Host "--- okr_tracker where (from C:\Windows) ---"
          Write-Host $where

          if (-not $where.Contains("$bundle\data")) {
            throw "okr_tracker resolved its data directory outside the app folder"
          }
          if (Test-Path "C:\Windows\data") {
            throw "the app wrote relative to the working directory"
          }
          if (-not (Test-Path "$bundle\data\secret.key")) {
            throw "the server did not write into the app's own data folder"
          }
          Write-Host "Settings and data resolve to the app folder, whatever the working directory."

      # The launcher a user actually double-clicks, run the way they run it.
      - name: Start it through OKR Tracker.vbs
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "dist/OKR-Tracker-Portable").Path
          Start-Process -FilePath "wscript.exe" `
            -ArgumentList "`"$bundle\OKR Tracker.vbs`"" `
            -WorkingDirectory "C:\Windows"
          $ok = $false
          foreach ($attempt in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $health = Invoke-RestMethod "http://127.0.0.1:8765/api/health" -TimeoutSec 5
              if ($health.status -eq "ok") { $ok = $true; break }
            } catch { }
          }
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) {
            $log = "$bundle\data\launcher.log"
            if (Test-Path $log) { Get-Content $log }
            throw "OKR Tracker.vbs did not start the app"
          }
          Write-Host "The .vbs launcher starts the app with no console window."

      # Remove the smoke test's data so nobody downloads a bundle with a
      # workspace already in it.
      - name: Reset the bundle's data folder
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist/OKR-Tracker-Portable/data/*
          New-Item -ItemType File -Path dist/OKR-Tracker-Portable/data/.gitkeep | Out-Null
          Remove-Item -Force dist/OKR-Tracker-Portable.zip -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/OKR-Tracker-Portable -DestinationPath dist/OKR-Tracker-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OKR-Tracker-Portable
          path: dist/OKR-Tracker-Portable.zip
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish release
    needs: portable
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OKR-Tracker-Portable

      # gh is preinstalled on the runner, so this needs no third-party action
      # and no extra permissions beyond the token above.
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download and run

          Download **OKR-Tracker-Portable.zip** below, unzip it, and
          double-click **OKR Tracker.vbs**. Your browser opens on the tracker.

          No Python, no installer, no administrator rights. Everything the app
          needs is inside the folder, and every binary in it is a signed
          python.org file.

          ## Sharing one workspace with a team

          Unzip the folder onto a shared drive and have everyone run it from
          there. It keeps its data inside the folder, so everyone sees and
          edits the same OKRs. Simultaneous saves are serialised across
          machines, and a save that loses a race is reported rather than
          overwriting someone.

          If Windows says *"UNC paths are not supported"*, that is CMD talking
          about network paths and it is harmless -- the app does not use the
          working directory. Use `OKR Tracker.vbs` and you will not see it at
          all.
          NOTES

          gh release create "${GITHUB_REF_NAME}" \
            OKR-Tracker-Portable.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "POLE OKR Tracker ${GITHUB_REF_NAME}" \
            --notes-file notes.md

      - name: Print the permanent download link
        run: |
          echo "Always-latest link, no login needed on a public repository:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/OKR-Tracker-Portable.zip"
